# GitHub Pages へのデプロイを行うワークフロー
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']

  # PR では検証（build ジョブ）のみ行い、デプロイはしない
  pull_request:

  # 手動実行を許可
  workflow_dispatch:

# GitHub Pages へのデプロイに必要な権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 複数のデプロイが並列で走らないように設定
# PR の検証は PR ごとに分け、デプロイの実行を打ち切らないようにする
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc -b

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      # scripts/ の書き出し・診断処理の単体テスト（Blender不要）。ルートからの相対パスで配信物を読む。
      - name: Python script tests
        run: |
          python3 -m pip install --quiet numpy pillow scipy
          python3 -m unittest discover -s scripts -t scripts -p 'test_*.py'

      - name: Build
        run: bun run build

      # GPU を使わない回帰検証のみ（通常の2D利用で3D用JS／モデルを取得しないこと）。
      # 3D描画を伴うブラウザ検証はソフトウェア描画だと重いため、引き続きローカルで実行する。
      # Google Chrome は GitHub ホストランナーにプリインストールされている。
      - name: Browser test (2D does not fetch 3D)
        run: bunx playwright test e2e/scene-chunk.e2e.ts --grep "2D entry does not request"

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite のデフォルトビルド出力先は dist
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
